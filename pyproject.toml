[project]
name = "journal"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "lancedb>=0.39.0",
    "nbstripout>=0.9.1",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import `src.*`; add the project root to sys.path so no install is needed.
pythonpath = ["."]
testpaths = ["tests"]
