# ─────────────────────────────────────────────────────────────
# Copy to config.yaml and edit. config.yaml is gitignored, so the
# real path to a private archive never enters this repo.
#
#     cp config.example.yaml config.yaml
#
# Override the location with the JOURNAL_CONFIG environment variable.
# ─────────────────────────────────────────────────────────────

# Everything derived from the journals lives under this root, which MUST be
# outside the repository. Git cannot see it, so it cannot leak it.
data_root: ~/playground/journal-data

paths:
  raw: ${data_root}/raw                    # source documents, never modified
  text: ${data_root}/text                  # entries.jsonl, chunks.jsonl, manifest
  index: ${data_root}/index                # LanceDB vector store
  eval: ${data_root}/eval                  # evaluation questions and saved runs
  facts: ${data_root}/facts.db             # experience index (Phase 5)
  corrections: ${data_root}/corrections.txt
  photo_dates: ${data_root}/photo_dates.json

# Local model server. Nothing here talks to the internet.
ollama:
  host: http://localhost:11434
  chat_model: gemma4:12b
  embed_model: qwen3-embedding:0.6b

embedding:
  # Must match the model above. Changing either INVALIDATES the index —
  # vectors from different models are not comparable — so a rebuild is
  # required, not an update. The model name is part of each row's hash so a
  # mismatch is detected rather than silently returning nonsense.
  dimensions: 1024
  batch: 32                 # throughput flattens above ~16 on Apple Silicon

  # MUST exceed the longest chunk. Text past this window is dropped SILENTLY and
  # its tail simply stops being findable — no error, no warning. The longest
  # chunk in this archive measures 417 tokens, so 1024 has 2.5x headroom; raise
  # it alongside chunking.max_chars.
  #
  # It is capped at all because Ollama otherwise loads this model with a 32K
  # window and spends 4.0 GB of KV cache on 639 MB of weights. With a 12B chat
  # model also resident that was 12.1 GB on a 32 GB machine, which swapped, and
  # one question took 176s instead of 41s.
  #
  # Changing this changes the vectors, so it invalidates the index exactly as a
  # model change does — unless nothing was being truncated before, which is
  # checkable: re-embed the longest chunks and compare to the stored vectors.
  num_ctx: 1024

  # Qwen3-Embedding is instruction-aware. This prefix goes on QUERIES ONLY;
  # documents are embedded bare. Measured during setup: with the prefix, the
  # spread between relevant and irrelevant passages went from 0.05 (unusable)
  # to 0.20. Applying it to documents degrades the whole index with no error.
  query_instruction: >-
    Given a search query, retrieve relevant passages from a personal travel journal

chunking:
  # A chunk is the unit of retrieval. Entries are split on paragraph
  # boundaries; only a single paragraph over the limit falls back to sentence
  # splitting, with overlap so a thought spanning the seam survives.
  # 1600, chosen by measurement and re-tuned after a bug fix.
  #
  # History, because the number is meaningless without it:
  #   2000 — dilution buried short incidents. "He forgot to give me 10 euro
  #          change" sits 98% through a 1,947-char entry and was unfindable
  #          even by near-verbatim query.
  #    600 — fixed dilution, broke paraphrase: the one question answerable only
  #          by semantic similarity fell out of the top 10 entirely.
  #   1100 — recall@1 0.33 -> 0.60, misses 2 -> 1. Best of the three.
  #
  # Then a real bug surfaced: convert.py joined Word paragraphs with a single
  # newline, so split_paragraphs (which looks for blank lines) saw 96% of
  # entries as ONE paragraph. Every chunk boundary was a sentence split, while
  # the code claimed to use paragraph seams. Fixing it took median paragraph
  # size from 1,371 to 455 chars — which made 1100 too small, since chunks now
  # pack several real paragraphs instead of cutting mid-thought.
  #
  #   1100 + real paragraphs — 4 regressions, 1 improvement
  #   1600 + real paragraphs — 9 of 12 questions at rank 1, mean rank 1.1,
  #                            paraphrase recovered from rank 6 to rank 2
  max_chars: 1600           # the finished chunk, header included
  min_chars: 120            # below this, fold into a neighbour
  overlap: 1                # sentences carried across a forced seam

retrieval:
  top_k: 5

  # hybrid | vector | fts
  #
  # DEFAULT IS vector, decided by measurement against the eval set:
  #
  #   mode                r@1   r@3   r@5  r@10  miss
  #   vector only        0.60  0.70  0.70  0.90    1   <- best
  #   fts only           0.40  0.60  0.60  0.70    3
  #   hybrid 1.0/1.0     0.50  0.50  0.50  0.80    2
  #   hybrid 1.0/0.3     0.50  0.50  0.70  0.80    2
  #   hybrid 1.0/0.15    0.50  0.50  0.70  0.90    1
  #
  # This was a surprise. BM25 clearly wins on individual queries — "Margarethe"
  # appears in 3 chunks and vector search finds one of them, while BM25 ranks
  # all three first; "glass orangery" goes from unfindable to rank 3. But
  # Reciprocal Rank Fusion rewards AGREEMENT over CONFIDENCE: a chunk both
  # retrievers rank 3rd beats one the vector side ranks 1st and BM25 never saw.
  # Where the vector side is already right, a frequently-wrong second opinion
  # can only dilute it, and lowering the weight merely converges back to
  # vector-only.
  #
  # Caveats: only 10 answerable eval questions, so one is worth 10 points; just
  # 2 of them are rare-term lookups, which is where BM25 wins. Adding more
  # name/restaurant/hotel questions could flip this. RRF is also one fusion
  # method — BM25 as a re-ranker over vector candidates is untested.
  #
  # `--mode fts` remains useful by hand for looking up a specific name.
  mode: vector

  # Slots reserved for chunks containing a RARE literal term from the query,
  # appended to the ranked results. A floor, not a quota — unused when the query
  # has no rare term.
  #
  # Dense retrieval has one catastrophic failure mode and this is the patch for
  # it: asked "the time i won a tombola", vector search did not return the entry
  # containing the word `tombola` in its TOP 100 — one of three entries in the
  # whole archive that contain it. A rare word inside a 1,600-character chunk
  # barely moves the embedding. Adding three words of context fixed it, which is
  # not something a person should need to know to search their own diary.
  #
  # Switching retriever does not fix it. On that query BM25 ranks it 4th and
  # hybrid 9th — so hybrid at k=5 still misses — while BM25 alone costs
  # recall@1 0.77 -> 0.46 across the eval set.
  #
  # Candidates for these slots are ranked by SIMILARITY to the query, not by how
  # often they contain the word. That matters more than it sounds: asked about a
  # tiffin, all nine entries containing that word mentioned it exactly once, so
  # any frequency tiebreak degenerates to file order. The right entry scored
  # 0.487 — 9th of 4,042 corpus-wide, which is why dense retrieval missed it —
  # but 1st among the nine that contain the word.
  #
  # Cost on the eval set: recall@1, recall@5 and misses all unchanged;
  # completeness@5 0.54 -> 0.58.
  rare_slots: 2
  vector_weight: 1.0
  fts_weight: 1.0

  # Top-k always returns k results whether or not k relevant ones exist.
  # Measured on this archive: a real query peaks at 0.70–0.79, while a question
  # about something that never happened peaks at ~0.57 — and the tail of a real
  # query sits around 0.59. So peak height and the drop from the top are both
  # needed to tell a match from the noise floor.
  min_score: 0.0            # drop results below this (0 disables)
  relative_cutoff: 0.0      # drop results more than this below the top (0 disables)

generation:
  # Ollama loads a conservative context window (~32K observed) regardless of what
  # the model supports, and exceeding it truncates the prompt SILENTLY — no
  # error, just a confidently wrong answer built from a partial prompt. Always
  # set this explicitly.
  #
  # Bigger is not free: the KV cache grows with the window (which is what
  # OLLAMA_KV_CACHE_TYPE=q8_0 in scripts/ollama-serve.sh mitigates). 8192 fits
  # comfortably — a 5-excerpt prompt measures ~1,600 tokens and even k=10 stays
  # under 4,000 — while a 16K window alongside a resident embedding model pushed
  # a 32 GB machine into swap.
  num_ctx: 8192
  temperature: 0.2          # recall, not creative writing

  # Thinking OFF. Not a style preference — a correctness fix.
  #
  # Measured on one question with k=6 (1,593-token prompt):
  #   think default : 6,599 tokens, 429s, and an EMPTY response. Ollama's
  #                   /api/generate returned neither `response` nor `thinking`,
  #                   so the entire 7 minutes of work was unrecoverable.
  #   think: false  : 83 tokens, 14.4s, a correct and correctly cited answer.
  #
  # Every generation timeout in this project traced back to this, including the
  # earlier mystery of num_predict: 60 returning empty strings — the budget went
  # to reasoning tokens that were then discarded. Answering from supplied
  # excerpts is extraction, not deduction; there is nothing for a chain of
  # thought to add here.
  think: false
