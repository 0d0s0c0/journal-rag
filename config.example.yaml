# ─────────────────────────────────────────────────────────────
# Copy to config.yaml and edit. config.yaml is gitignored so the
# real path to your journals never enters this public repo.
#
#     cp config.example.yaml config.yaml
# ─────────────────────────────────────────────────────────────

# Everything derived from your journals lives under this root.
# It sits as a SIBLING of the repo, not inside it — git cannot see
# it, so it cannot leak it. (Verified that ~/playground is not
# itself a git repo; if it were, this would be inside one.)
data_root: ~/playground/journal-data

paths:
  raw: ${data_root}/raw       # original .doc / .docx, never modified
  text: ${data_root}/text     # converted plain text
  index: ${data_root}/index   # vector database
  facts: ${data_root}/facts.db # extracted structured facts (Phase 5)
  eval: ${data_root}/eval     # evaluation question sets (Phase 6)

# Local model server. Nothing here talks to the internet.
ollama:
  host: http://localhost:11434
  chat_model: gemma4:12b
  embed_model: qwen3-embedding:0.6b

embedding:
  dimensions: 1024            # qwen3-embedding:0.6b output size

  # Qwen3-Embedding is INSTRUCTION-AWARE. Queries must carry a task prefix or
  # retrieval quality collapses silently — measured spread across candidates
  # went from 0.05 (unusable) to 0.19 just by adding it. See docs/SETUP.md.
  #
  # Applies to QUERIES ONLY. Documents are embedded bare. Getting this
  # backwards degrades the entire index with no error.
  query_instruction: >-
    Given a search query, retrieve relevant passages from a personal travel journal
  query_template: "Instruct: {instruction}\nQuery: {query}"

# Phase 2 — chunking. We chunk by journal entry, not by character
# count; these are the fallback bounds for unusually long entries.
chunking:
  max_chars: 2000
  overlap: 200
  prepend_context: true       # stamp date + location onto each chunk
                              # so it is interpretable on its own

# Phase 3/5 — retrieval.
retrieval:
  top_k: 5
  hybrid: false               # true from Phase 5 (vectors + BM25)
  bm25_weight: 0.4
  use_metadata_filter: true   # year/date filters parsed from question

# Phase 4 — generation.
generation:
  # Ollama loads models with a conservative default context (~32K observed),
  # NOT the model's full capability (gemma4 supports 256K). Exceeding the
  # loaded window truncates the prompt SILENTLY — no error, just a wrong
  # answer from partial context. Always set this explicitly.
  # Bigger isn't free: the KV cache grows with context. Size it against the
  # actual retrieved-chunk volume measured in Phase 3.
  num_ctx: 32768
  temperature: 0.2            # low: recall, not creative writing
  cite_sources: true
  refuse_when_unsupported: true # say "not in the journals" over guessing
